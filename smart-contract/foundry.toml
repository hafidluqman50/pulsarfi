[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./script/artifacts" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@uniswap/v2-core/=lib/v2-core/",
  "@uniswap/v2-periphery/=lib/v2-periphery/",
  "@uniswap/lib/=lib/solidity-lib/",
  "@uniswap/v4-core/=lib/uniswap-hooks/lib/v4-core/",
  "@uniswap/v4-periphery/=lib/uniswap-hooks/lib/v4-periphery/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "@openzeppelin/uniswap-hooks/=lib/uniswap-hooks/src/",
]

[invariant]
runs = 64
depth = 100
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
